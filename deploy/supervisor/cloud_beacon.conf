; =============================================================================
; Supervisor config untuk Cloud Beacon (Laravel 12) — server AlmaLinux + Plesk
; Menjalankan proses long-running, menggantikan cron sepenuhnya:
;   1. queue:work (default)  -> job forwarding (ForwardToIntegrations, ResendForwarding)
;   2. queue:work (sync)     -> job sinkron MQTT INFO per-logger (SyncLoggerInfo)
;                               dipakai tombol "Refresh" & command loggers:sync.
;                               WAJIB ada; kalau tidak, status logger tidak pernah
;                               ter-update (job nyangkut di tabel jobs).
;   3. queue:work (backfill) -> job RunLoggerBackfill (RESEND MQTT data hilang).
;                               WAJIB ada; kalau tidak, klik "Backfill" = job nyangkut.
;   4. schedule:work         -> menggantikan cron "schedule:run": loggers:sync (5 mnt),
;                               audit:scan (per jam).
;
; AlmaLinux / RHEL-based:
;   Salin file ini ke:  /etc/supervisord.d/cloud_beacon.ini   (ekstensi .ini!)
;   Lalu:  supervisorctl reread && supervisorctl update
;
; Nilai di bawah sudah disesuaikan untuk subscription Plesk "be-stesy.cloud":
;   path = /var/www/vhosts/be-stesy.cloud/httpdocs
;   user = be-stesy
;   php  = /opt/plesk/php/8.3/bin/php   (full path, PATH Supervisor bisa beda)
;
; CATATAN penting soal --timeout vs queue retry_after (config/queue.php):
;   retry_after = 150  → setiap --timeout HARUS < 150, kalau tidak job dobel.
; =============================================================================

[program:cloud-beacon-worker]
process_name=%(program_name)s_%(process_num)02d
command=/opt/plesk/php/8.3/bin/php /var/www/vhosts/be-stesy.cloud/httpdocs/artisan queue:work --queue=default --sleep=3 --tries=1 --timeout=120 --max-time=3600
directory=/var/www/vhosts/be-stesy.cloud/httpdocs
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=be-stesy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vhosts/be-stesy.cloud/httpdocs/storage/logs/worker.log
stopwaitsecs=130

[program:cloud-beacon-sync]
process_name=%(program_name)s_%(process_num)02d
command=/opt/plesk/php/8.3/bin/php /var/www/vhosts/be-stesy.cloud/httpdocs/artisan queue:work --queue=sync --sleep=3 --tries=1 --timeout=45 --max-time=3600
directory=/var/www/vhosts/be-stesy.cloud/httpdocs
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=be-stesy
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/vhosts/be-stesy.cloud/httpdocs/storage/logs/sync-worker.log
stopwaitsecs=50

[program:cloud-beacon-backfill]
process_name=%(program_name)s_%(process_num)02d
command=/opt/plesk/php/8.3/bin/php /var/www/vhosts/be-stesy.cloud/httpdocs/artisan queue:work --queue=backfill --sleep=3 --tries=1 --timeout=60 --max-time=3600
directory=/var/www/vhosts/be-stesy.cloud/httpdocs
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=be-stesy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/vhosts/be-stesy.cloud/httpdocs/storage/logs/backfill-worker.log
stopwaitsecs=70

[program:cloud-beacon-scheduler]
process_name=%(program_name)s
command=/opt/plesk/php/8.3/bin/php /var/www/vhosts/be-stesy.cloud/httpdocs/artisan schedule:work
directory=/var/www/vhosts/be-stesy.cloud/httpdocs
autostart=true
autorestart=true
user=be-stesy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vhosts/be-stesy.cloud/httpdocs/storage/logs/scheduler.log
